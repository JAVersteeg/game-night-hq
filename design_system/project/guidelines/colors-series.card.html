<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-sans);color:var(--ink);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:var(--accent)}a:hover{color:var(--accent-strong)}.row{display:flex;gap:10px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}.n{font-size:11px;font-weight:600;letter-spacing:.02em}.v{font-size:10px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}.meta{font-size:11px;font-weight:500;color:var(--ink-subtle);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw" style="background:var(--series-1);color:#16120e;min-height:72px"><div class="n">series-1</div></div><div class="sw" style="background:var(--series-2);color:#16120e;min-height:72px"><div class="n">series-2</div></div><div class="sw" style="background:var(--series-3);color:#16120e;min-height:72px"><div class="n">series-3</div></div><div class="sw" style="background:var(--series-4);color:#16120e;min-height:72px"><div class="n">series-4</div></div><div class="sw" style="background:var(--series-5);color:#16120e;min-height:72px"><div class="n">series-5</div></div><div class="sw" style="background:var(--series-6);color:#16120e;min-height:72px"><div class="n">series-6</div></div></div></body></html>
