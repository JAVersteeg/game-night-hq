<!-- @dsCard group="Brand" viewport="700x170" name="Elevation" subtitle="No drop shadows in the app. A hairline border and a surface tint do the work." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-sans);color:var(--ink);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:var(--accent)}a:hover{color:var(--accent-strong)}.row{display:flex;gap:10px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}.n{font-size:11px;font-weight:600;letter-spacing:.02em}.v{font-size:10px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}.meta{font-size:11px;font-weight:500;color:var(--ink-subtle);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div style="flex:1;border:var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:14px"><div style="font:600 16px/24px var(--font-sans)">Card</div><div class="meta" style="margin-top:4px">1px --line on --surface</div></div><div style="flex:1;border:var(--border);border-radius:var(--radius-lg);background:var(--surface-muted);padding:14px"><div style="font:600 16px/24px var(--font-sans)">Placeholder</div><div class="meta" style="margin-top:4px">1px --line on --surface-muted</div></div><div style="flex:1;border:var(--border-strong);border-radius:var(--radius-lg);padding:14px"><div style="font:600 16px/24px var(--font-sans)">Ghost control</div><div class="meta" style="margin-top:4px">1px --line-strong, transparent</div></div></div><div class="meta" style="margin-top:12px">--shadow-sm and --shadow-md exist for web surfaces only. Do not use them on app screens.</div></body></html>
