<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-sans);color:var(--ink);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:var(--accent)}a:hover{color:var(--accent-strong)}.row{display:flex;gap:10px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}.n{font-size:11px;font-weight:600;letter-spacing:.02em}.v{font-size:10px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}.meta{font-size:11px;font-weight:500;color:var(--ink-subtle);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;align-items:baseline;gap:16px;padding:6px 0"><div class="meta" style="width:112px;flex:0 0 auto">3xl / bold</div><div style="font:700 30px/36px var(--font-sans);letter-spacing:-.025em">Jouw groepen</div><div class="meta" style="margin-left:auto;flex:0 0 auto">30 / 36 · -0.025em</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:6px 0"><div class="meta" style="width:112px;flex:0 0 auto">2xl / bold</div><div style="font:700 24px/32px var(--font-sans);letter-spacing:-.025em">Hoe mogen we je noemen?</div><div class="meta" style="margin-left:auto;flex:0 0 auto">24 / 32 · -0.025em</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:6px 0"><div class="meta" style="width:112px;flex:0 0 auto">xl / semibold</div><div style="font:600 20px/28px var(--font-sans)">Nog geen groepen</div><div class="meta" style="margin-left:auto;flex:0 0 auto">20 / 28</div></div></body></html>
