<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-sans);color:var(--ink);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:var(--accent)}a:hover{color:var(--accent-strong)}.row{display:flex;gap:10px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}.n{font-size:11px;font-weight:600;letter-spacing:.02em}.v{font-size:10px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}.meta{font-size:11px;font-weight:500;color:var(--ink-subtle);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div style="flex:1"><div style="background:var(--accent);color:var(--accent-fg);border-radius:var(--radius-lg);padding:14px 24px;text-align:center;font:600 16px/24px var(--font-sans);letter-spacing:-.025em;opacity:1">Doorgaan</div><div class="meta" style="margin-top:6px">Rest · opacity 1</div></div><div style="flex:1"><div style="background:var(--accent);color:var(--accent-fg);border-radius:var(--radius-lg);padding:14px 24px;text-align:center;font:600 16px/24px var(--font-sans);letter-spacing:-.025em;opacity:0.8">Doorgaan</div><div class="meta" style="margin-top:6px">Pressed · opacity 0.8</div></div><div style="flex:1"><div style="background:var(--accent);color:var(--accent-fg);border-radius:var(--radius-lg);padding:14px 24px;text-align:center;font:600 16px/24px var(--font-sans);letter-spacing:-.025em;opacity:0.5">Doorgaan</div><div class="meta" style="margin-top:6px">Disabled · opacity 0.5</div></div><div style="flex:1"><div style="border:var(--border-strong);border-radius:var(--radius-lg);padding:14px 24px;text-align:center;font:600 16px/24px var(--font-sans);background:var(--surface-muted);color:var(--ink)">Annuleren</div><div class="meta" style="margin-top:6px">Ghost pressed · fills --surface-muted</div></div></div></body></html>
